<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Wheel check</title>
<link rel="stylesheet" href="style.css?v=12"></head>
<body>
<main class="doc"><h1 style="font-size:1.6rem">Wheel check</h1>
<p>Send a screenshot of this whole page.</p>
<svg class="wheel" viewBox="-170 -170 340 340" width="220" height="220" style="display:block;margin:10px auto;position:static"><circle class="disc" r="166"/><g class="s"><path d="M0 -150A150 150 0 0 1 130 -75L50 -28A57 57 0 0 0 0 -57Z"/><text x="40" y="-90">JPG</text></g><circle class="hub" r="55"/><circle class="dotw" cx="0" cy="-63" r="5.5"/></svg>
<pre id="o" style="white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace;color:var(--fg)"></pre></main>
<script>
const g=(el,p)=>getComputedStyle(el).getPropertyValue(p).trim();
const d=document.querySelector('.disc'),h=document.querySelector('.hub'),p=document.querySelector('.s path'),r=document.documentElement;
document.getElementById('o').textContent=[
 'dark: '+matchMedia('(prefers-color-scheme: dark)').matches,
 'html class: "'+r.className+'"',
 'width: '+innerWidth+' dpr '+devicePixelRatio,
 '--bg: '+g(r,'--bg')+'  --fg: '+g(r,'--fg')+'  --card: '+g(r,'--card'),
 'body background: '+g(document.body,'background-color'),
 'disc fill: '+g(d,'fill')+'  opacity '+g(d,'fill-opacity'),
 'hub fill: '+g(h,'fill'),
 'slice fill: '+g(p,'fill')+'  opacity '+g(p,'fill-opacity'),
 'color-mix supported: '+CSS.supports('color','color-mix(in srgb, red 50%, blue)'),
 'stylesheet rules with .disc: '+[...document.styleSheets].flatMap(s=>{try{return [...s.cssRules]}catch(e){return []}}).filter(x=>x.selectorText&&x.selectorText.includes('.disc')).map(x=>x.cssText.slice(0,90)).join(' | '),
 'ua: '+navigator.userAgent
].join('\n');
</script></body></html>
